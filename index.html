<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my-portfolio</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- cursor -->

  <div id="cursor" class="fixed top-0 left-0 pointer-events-none z-9999 hidden md:block">
    <div
      class="w-10 h-10 border border-white/80 rounded-full -translate-x-1/2 -translate-y-1/2 transition-all duration-200">
    </div>
    <!-- <div class="absolute top-1/2 left-1/2 w-2 h-2 bg-white rounded-full -translate-x-1/2 -translate-y-1/2"></div> -->
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    let mouseX = 0, mouseY = 0;
    let cursorX = 0, cursorY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (cursor.classList.contains('hidden')) cursor.classList.remove('hidden');
    });

    function moveCursor() {
      cursorX += (mouseX - cursorX) * 0.18;
      cursorY += (mouseY - cursorY) * 0.18;

      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
      requestAnimationFrame(moveCursor);
    }
    moveCursor();

    // Hover effect on links & buttons
    document.querySelectorAll('a, button').forEach(item => {
      item.addEventListener('mouseenter', () => {
        cursor.style.transform += ' scale(1.7)';
        cursor.querySelector('div').style.borderColor = '#D4FF00';
      });
      item.addEventListener('mouseleave', () => {
        cursor.style.transform = cursor.style.transform.replace(' scale(1.7)', '');
        cursor.querySelector('div').style.borderColor = 'rgba(255,255,255,0.6)';
      });
    });
  </script>
</body>

</html>
